<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <radialGradient id="grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#960404" />
      <stop offset="100%" stop-color="#3d0101" />
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2" />
      <stop offset="50%" stop-color="#f0b415" />
      <stop offset="100%" stop-color="#c48a04" />
    </linearGradient>
  </defs>
  <circle cx="50" cy="50" r="48" fill="url(#grad)" stroke="url(#gold)" stroke-width="3" />
  <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(240, 180, 21, 0.4)" stroke-width="1" stroke-dasharray="3,3" />
  <!-- Sacred Om Symbol in Gold -->
  <text x="50" y="62" font-family="'Segoe UI Symbol', 'Noto Sans Devanagari', 'Arial Unicode MS', sans-serif" font-size="44" font-weight="900" fill="url(#gold)" text-anchor="middle">ॐ</text>
</svg>
